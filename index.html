
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>GitHub User Search</title>


</head>

<body>
    <div class="main">
        <div class="page-header">
            <img id="sm-img"
                src="user.jpg"
                alt="GitHub User Search logo">

            <h1>GitHub Username Search</h1>

            <div class="search-box">
                <input id="usernameInput" type="text" placeholder="Enter GitHub username" autocomplete="off">
                <button id="searchBtn" type="button">Search</button>
            </div>
        </div>

        <div class="card">
            <div>
                <img id="image" src="https://placehold.co/100x100?text=User" alt="GitHub user avatar">
            </div>

            <div class="user-info">
                <h2 id="username">Username</h2>

                <p>
                    <span>Followers:</span>
                    <span id="followers">0</span>
                </p>

                <p>
                    <span>Repos:</span>
                    <span id="repos">0</span>
                </p>

                <p>Following: <span id="following">0</span></p>

                <a id="profileLink" href="#" target="_blank">
                    View GitHub Profile
                </a>
            </div>
        </div>
    </div>

<script src="script.js"></script>

</body>
</html>
